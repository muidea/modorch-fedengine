name: Rust validation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MODORCH_REVISION: 336ba20196044e1b81fb2ca297a18b5e258a5800
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: '1.94.0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  library-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check library contracts and metadata
        run: |
          python3 scripts/check-library-contracts.py
          python3 -B -m unittest discover -s tests/contracts -p 'test_*.py' -v

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          # Exclusions must all hold; unknown paths conservatively require validation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!README.md'
              - '!LICENSE'
              - '!docs/**/*.md'

  validate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: modorch-fedengine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: modorch-fedengine
          persist-credentials: false
      - name: Install pinned development toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check management JavaScript
        run: |
          node --check crates/modorch-fedengine-management/web/app.js
          node --check crates/modorch-fedengine-management/web/browser.js
          node --check crates/modorch-fedengine-management/web/navigator.js
          node --check crates/modorch-fedengine-management/web/organization.js
          node --check scripts/web-smoke.mjs
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: modorch-fedengine -> target
          key: modorch-${{ env.MODORCH_REVISION }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Restore DuckDB native library and extensions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: duckdb-cache
        with:
          path: |
            modorch-fedengine/target/duckdb-download
            modorch-fedengine/data/extensions
          key: duckdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('modorch-fedengine/Cargo.lock', 'modorch-fedengine/scripts/fetch-extensions.py') }}
      - name: Resolve dependencies and check framework identity
        run: |
          cargo fetch --locked
          python3 .agents/skills/modorch-app-development/scripts/preflight.py --manifest-path Cargo.toml
          python3 .agents/skills/modorch-fedengine-integration/scripts/preflight.py --manifest-path Cargo.toml
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: External embedded host
        run: python3 scripts/test-embedded-host.py
      - name: Development test-host smoke
        run: |
          cargo build --example fedengine-test-host --locked
          python3 scripts/smoke.py
      - name: Management browser smoke
        run: node scripts/web-smoke.mjs --chrome "$(command -v google-chrome)"
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Disposable federation integration
        run: scripts/test-federation.sh
      - name: Save DuckDB native library and extensions
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.duckdb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            modorch-fedengine/target/duckdb-download
            modorch-fedengine/data/extensions
          key: ${{ steps.duckdb-cache.outputs.cache-primary-key }}

  # Keep the existing required check name, including on documentation-only PRs.
  check:
    if: always()
    needs: [changes, validate, library-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful validation or a documentation-only skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          CONTRACTS_RESULT: ${{ needs.library-contracts.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$CONTRACTS_RESULT" = success
          case "$CODE_CHANGED:$VALIDATION_RESULT" in
            true:success) echo 'Code validation passed.' ;;
            false:skipped) echo 'Documentation-only change; build skipped.' ;;
            *) echo 'Required validation failed, was canceled, or was unexpectedly skipped.'; exit 1 ;;
          esac
